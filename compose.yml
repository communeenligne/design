# docker compose up                                  documentation site in development: http://localhost:4321
# docker compose run --rm node npm test              package tests
# docker compose run --rm node npm run check      tests, build, links
# docker compose --profile preview up --build preview   built site, served by nginx: http://localhost:8081
#
# After a package-lock.json change: docker compose build && docker compose down -v (image dependencies).

name: communeenligne-design

services:
  site:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true

  node:
    build:
      context: .
      target: dev
    profiles: ["tools"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["npm", "run", "check"]

  preview:
    build:
      context: .
      target: preview
    profiles: ["preview"]
    ports:
      - "8081:80"

volumes:
  node_modules:
