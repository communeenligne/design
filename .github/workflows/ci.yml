# Continuous integration: package tests (contrasts, exports, generated files), site build, internal links.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package tests (contrasts, exports, generated files)
        run: npm test
      - name: Package archive (published files)
        run: npm pack -w @communeenligne/design --dry-run
      - name: Site build
        run: npm run build
      - name: Internal links, inline styles and scripts, noindex
        run: npm run links
      - name: Docker image
        run: docker build --target build .
