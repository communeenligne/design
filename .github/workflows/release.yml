# Publication d'une version : à l'étiquette vX.Y.Z, vérifie qu'elle correspond à packages/design/package.json, lance les
# tests, construit l'archive du paquet (npm pack) et la joint à une publication GitHub du même nom.
name: Publication

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: L'étiquette correspond à la version du paquet
        run: test "v$(node -p "require('./packages/design/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Archive
        run: npm pack -w @communeenligne/design
      - name: Publication GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" communeenligne-design-*.tgz --title "$GITHUB_REF_NAME" --notes "Voir CHANGELOG.md. Installation : \"@communeenligne/design\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/communeenligne-design-${GITHUB_REF_NAME#v}.tgz\""
