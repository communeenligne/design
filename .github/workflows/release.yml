# Release: on a vX.Y.Z tag, checks that it matches packages/design/package.json, runs the tests, builds the package
# archive (npm pack) and attaches it to a GitHub release of the same name.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches the package version
        run: test "v$(node -p "require('./packages/design/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Package archive
        run: npm pack -w @communeenligne/design
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" communeenligne-design-*.tgz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Install: \"@communeenligne/design\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/communeenligne-design-${GITHUB_REF_NAME#v}.tgz\""
